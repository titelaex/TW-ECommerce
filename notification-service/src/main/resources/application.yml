server:
  port: 8088

spring:
  application:
    name: notification-service
  config:
    # Secretele locale (FIREBASE_*) stau in notification-service/.env, ignorat de git. Vezi .env.example.
    # A doua cale acopera rularea cu working directory = radacina repo-ului (ex. IntelliJ).
    import: optional:file:.env[.properties],optional:file:notification-service/.env[.properties]

firebase:
  # Cale catre cheia de service account (Firebase Console > Project settings > Service accounts).
  # Gol => se foloseste GOOGLE_APPLICATION_CREDENTIALS. Pentru emulator: setati FIRESTORE_EMULATOR_HOST.
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  project-id: ${FIREBASE_PROJECT_ID:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
