server:
  port: 8085

spring:
  application:
    name: order-service
  config:
    # Secretele locale (DB_PASSWORD etc.) stau in order-service/.env, ignorat de git. Vezi .env.example.
    # A doua cale acopera rularea cu working directory = radacina repo-ului (ex. IntelliJ).
    import: optional:file:.env[.properties],optional:file:order-service/.env[.properties]
  datasource:
    # Implicit: containerul din docker-compose.yml (radacina repo-ului)
    url: ${DB_URL:jdbc:postgresql://localhost:5433/orders_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # TODO: inlocuit cu Flyway/Liquibase cand schema se stabilizeaza
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

order:
  currency: RON

management:
  endpoints:
    web:
      exposure:
        include: health,info
